name: ci
# Public repository: CI runs only on GitHub-hosted runners with a read-only token, so pull requests (also from forks)
# never reach a self-hosted machine.
on:
  push: { branches: [main] }
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g homey >/dev/null
      - run: npm ci && npm run lint && npm run build && npm test
      - name: Release version check
        run: npm run release:check
      - run: homey app validate
