name: ci
# Public repository: CI runs only on GitHub-hosted runners with a read-only token, so fork pull requests never reach
# the owner's self-hosted hardware runner.
on:
  push: { branches: [main] }
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ github.sha }}
