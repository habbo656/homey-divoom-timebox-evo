name: agent-pipeline
# One issue end to end: guard → develop (plan, implement, docs, gate) → publish → gate + independent review →
# hardware test (self-hosted) → finish (merge or next fix round). Model jobs get read-only tokens and no GitHub access;
# deterministic jobs publish their results. Docs: docs/pipeline.md.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty = next approved issue from docs/roadmap.md)
        default: ""
      round:
        description: Fix round (1-3; 3 = Opus escalation)
        default: "1"
      from:
        description: Issue that just finished (the next-step note goes there)
        default: ""
  schedule:
    - cron: "17 */3 * * *" # resumes after a usage limit and picks up newly approved issues
permissions: {}
concurrency:
  group: agent-pipeline
  cancel-in-progress: false
env:
  OWNER: ${{ github.repository_owner }}
  # The pipeline's GitHub App (docs/pipeline.md "Bot identity"): REST/event login and GraphQL login (without [bot]).
  BOT: ${{ vars.AGENT_BOT_SLUG }}[bot]
  BOT_LOGIN: ${{ vars.AGENT_BOT_SLUG }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read # writes use the bot token
    outputs:
      go: ${{ steps.s.outputs.go }}
      issue: ${{ steps.s.outputs.issue }}
      kind: ${{ steps.s.outputs.kind }}
      version: ${{ steps.s.outputs.version }}
      round: ${{ steps.s.outputs.round }}
      branch: ${{ steps.s.outputs.branch }}
      stage: ${{ steps.s.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - id: next
        if: inputs.issue == ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: bash scripts/agent/next.sh
      - id: s
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          IN_ISSUE: ${{ inputs.issue }}
          IN_ROUND: ${{ inputs.round || '1' }}
          FROM: ${{ inputs.from }}
          NEXT_KIND: ${{ steps.next.outputs.kind }}
          NEXT_ISSUE: ${{ steps.next.outputs.issue }}
          NEXT_REASON: ${{ steps.next.outputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          n=${IN_ISSUE:-$NEXT_ISSUE}
          if [ -z "$IN_ISSUE" ] && [ "$NEXT_KIND" != issue ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to start: $NEXT_KIND — $NEXT_REASON" >> "$GITHUB_STEP_SUMMARY"
            [[ "$FROM" =~ ^[0-9]+$ ]] && bash scripts/agent/issue.sh say "$FROM" "next step: $NEXT_REASON"
            exit 0
          fi
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "bad issue '$n'"; exit 1; }
          [[ "$IN_ROUND" =~ ^[1-9]$ ]] || IN_ROUND=1
          labels=",$(gh issue view "$n" --json labels --jq '[.labels[].name] | join(",")'),"
          kind=issue; version=""
          if [[ "$labels" == *",uat,"* ]]; then
            kind=uat
            version=$(gh issue view "$n" --json title --jq .title | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | tr -d v)
          fi
          branch=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/agent/issue-$n-" --jq '.[0].ref // empty' | sed 's|^refs/heads/||')
          stage=develop
          if [ -n "$branch" ] && [ "$kind" = issue ]; then
            # Approved at this head already (e.g. after /agent approve-diff or a hardware block): skip develop + review.
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)
            # Verify only: the PR head was reviewed with "approve" and no findings were filed for that commit.
            if [ -n "$pr" ] && [ "$IN_ROUND" = 1 ] \
               && gh pr view "$pr" --json comments --jq '.comments[] | select(.author.login == env.BOT_LOGIN) | .body' \
                  | grep -q "<!-- agent-review sha=$head verdict=approve -->" \
               && ! bash scripts/agent/issue.sh marker "$n" findings | grep -q "sha=$head"; then
              stage=verify
            fi
          fi
          printf 'go=true\nissue=%s\nkind=%s\nversion=%s\nround=%s\nbranch=%s\nstage=%s\n' \
            "$n" "$kind" "$version" "$IN_ROUND" "${branch:-main}" "$stage" | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          gh issue edit "$n" --add-label status:in-progress >/dev/null 2>&1 || true

  guard:
    needs: pick
    if: needs.pick.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.pick.outputs.issue }}
          KIND: ${{ needs.pick.outputs.kind }}
          VERSION: ${{ needs.pick.outputs.version }}
        run: |
          bash scripts/agent/issue.sh verify "$N" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p ctx
          bash scripts/agent/issue.sh context "$N" ctx/context.md
          : > ctx/milestone.md
          if [ "$KIND" = uat ]; then
            ms=$(gh issue view "$N" --json milestone --jq '.milestone.title // empty')
            for i in $(gh issue list --milestone "$ms" --state all --limit 100 --json number,labels \
                         --jq '.[] | select([.labels[].name] | index("uat") | not) | .number'); do
              # Only issues the owner approved for the agents enter the UAT context.
              bash scripts/agent/issue.sh verify "$i" >/dev/null 2>&1 || gh issue view "$i" --json labels --jq '[.labels[].name]' | grep -q '"agent:approved"' || continue
              bash scripts/agent/issue.sh context "$i" "ctx/i$i.md" && cat "ctx/i$i.md" >> ctx/milestone.md && rm "ctx/i$i.md"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: context
          path: ctx/
          retention-days: 3

  develop:
    needs: [pick, guard]
    if: needs.pick.outputs.stage == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: agents
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.c.outputs.ok }}
      limited: ${{ steps.c.outputs.limited }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the existing agent branch
        if: needs.pick.outputs.branch != 'main'
        env:
          B: ${{ needs.pick.outputs.branch }}
        run: git fetch -q origin "$B:$B" && git switch -q "$B"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci >/dev/null && npm install -g homey >/dev/null
      - env:
          NAME: ${{ vars.AGENT_BOT_SLUG }}[bot]
          EMAIL: ${{ vars.AGENT_BOT_EMAIL }}
        run: git config user.name "$NAME" && git config user.email "$EMAIL"
      - uses: actions/download-artifact@v4
        with:
          name: context
          path: ${{ runner.temp }}/ctx
      - id: c
        # Below the job timeout, so that a stuck session still leaves time to bundle and upload its progress.
        timeout-minutes: 165
        uses: ./.github/actions/claude
        env:
          VAR_ISSUE: ${{ needs.pick.outputs.issue }}
          VAR_KIND: ${{ needs.pick.outputs.kind }}
          VAR_ROUND: ${{ needs.pick.outputs.round }}
          VAR_VERSION: ${{ needs.pick.outputs.version }}
          VAR_BRANCH: ${{ needs.pick.outputs.branch }}
          VAR_CONTEXT: ${{ runner.temp }}/ctx/context.md
          VAR_MILESTONE_CONTEXT: ${{ runner.temp }}/ctx/milestone.md
        with:
          prompt-file: .github/agent/develop.md
          schema-file: .github/agent/develop.schema.json
          model: sonnet
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Bundle the branch
        # Also after a failed, cancelled or timed-out session: publish pushes whatever progress the branch holds.
        if: always()
        env:
          RESULT: ${{ steps.c.outputs.result-file }}
          N: ${{ needs.pick.outputs.issue }}
        run: |
          # Outside the checkout: out/ is not ignored, and the commit of uncommitted changes below must not pick it up.
          out="$RUNNER_TEMP/develop-out"; mkdir -p "$out"
          [ -n "$RESULT" ] && [ -s "$RESULT" ] && cp "$RESULT" "$out/result.json"
          re="^agent/issue-$N-[a-z0-9][a-z0-9-]{0,50}$"
          b=""
          [ -s "$out/result.json" ] && b=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("branch",""))' "$out/result.json")
          if ! [[ "$b" =~ $re ]] || ! git rev-parse -q --verify "refs/heads/$b" >/dev/null; then
            b=$(git branch --show-current); [[ "$b" =~ $re ]] || b=""
          fi
          if [ -n "$b" ]; then
            if [ "$(git branch --show-current)" = "$b" ] && [ -n "$(git status --porcelain)" ]; then
              git add -A && git commit -qm "chore: uncommitted agent changes (#$N)"
            fi
            git bundle create "$out/branch.bundle" "refs/heads/$b" ^origin/main 2>/dev/null || true
          fi
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop
          path: ${{ runner.temp }}/develop-out/
          retention-days: 3

  publish:
    needs: [pick, develop]
    if: always() && needs.pick.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read # writes use the bot token
    outputs:
      next: ${{ steps.p.outputs.next }}
      sha: ${{ steps.p.outputs.sha }}
      branch: ${{ steps.p.outputs.branch }}
      pr: ${{ steps.p.outputs.pr }}
      protected: ${{ steps.p.outputs.protected }}
      docs_only: ${{ steps.p.outputs.docs_only }}
      needs_hwtest: ${{ steps.p.outputs.needs_hwtest }}
      diff_approved: ${{ steps.p.outputs.diff_approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          name: ${{ vars.AGENT_BOT_SLUG }}[bot]
          email: ${{ vars.AGENT_BOT_EMAIL }}
          git: "true"
      - uses: actions/download-artifact@v4
        if: needs.pick.outputs.stage == 'develop'
        with:
          name: develop
          path: ${{ runner.temp }}/out
        continue-on-error: true
      - id: p
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          N: ${{ needs.pick.outputs.issue }}
          KIND: ${{ needs.pick.outputs.kind }}
          STAGE: ${{ needs.pick.outputs.stage }}
          PICKED: ${{ needs.pick.outputs.branch }}
          DEV: ${{ needs.develop.result }}
          OK: ${{ needs.develop.outputs.ok }}
          LIMITED: ${{ needs.develop.outputs.limited }}
          OUT: ${{ runner.temp }}/out
          ROUND: ${{ needs.pick.outputs.round }}
        run: |
          say() { bash scripts/agent/issue.sh say "$N" "$1"; }
          stop() { echo "next=stop" >> "$GITHUB_OUTPUT"; exit 0; }
          j() { python3 -c 'import json,os,sys; print(json.load(open(os.environ["OUT"]+"/result.json")).get(sys.argv[1], ""))' "$1"; }
          if [ "$STAGE" = develop ]; then
            # Checkpoint first, whatever the outcome: post a new plan and push the branch's commits (fast-forward
            # only, no PR), so that the next run reuses the plan and continues the branch instead of redoing the work.
            res=false; [ -s "$OUT/result.json" ] && res=true
            hw=true; [ $res = true ] && hw=$(j needs_hwtest | tr 'TF' 'tf')
            if [ $res = true ]; then
              plan=$(j plan)
              if [ -n "$plan" ] && [ "$plan" != none ] \
                 && { [ "$(j plan_is_new)" = True ] || [ "$(bash scripts/agent/issue.sh markers "$N" plan)" -eq 0 ]; }; then
                { echo "## Plan"; echo; printf '%s\n' "$plan"; echo; echo "## Hardware test scenario"; echo; j hw_scenario; echo; echo "<!-- agent-plan hw=$hw -->"; } > plan.md
                gh issue comment "$N" --body-file plan.md >/dev/null
              fi
            fi
            b=""; pushed=false; push_err=""
            [ -s "$OUT/branch.bundle" ] && b=$(git bundle list-heads "$OUT/branch.bundle" | sed -n 's|^[0-9a-f]* refs/heads/||p' | head -n 1)
            if [ -n "$b" ]; then
              if ! [[ "$b" =~ ^agent/issue-$N-[a-z0-9][a-z0-9-]{0,50}$ ]]; then
                push_err="develop returned an invalid branch name; nothing pushed."
              else
                git fetch -q "$OUT/branch.bundle" "refs/heads/$b:refs/heads/$b"
                git fetch -q origin main
                if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
                  git fetch -q origin "$b:refs/remotes/origin/$b"
                  git merge-base --is-ancestor "origin/$b" "$b" || push_err="the new commits do not extend \`$b\` (no force pushes)."
                elif ! git merge-base --is-ancestor origin/main "$b"; then
                  # main moved during the run. GitHub compares a new branch with the current main, so the app's push would
                  # look like it reverts main's workflow changes and be refused: rebase the (unpublished) branch first.
                  git rebase -q origin/main "$b" >/dev/null 2>&1 \
                    || { git rebase --abort >/dev/null 2>&1; push_err="\`$b\` does not rebase cleanly onto the current main; nothing pushed."; }
                fi
                if [ -z "$push_err" ]; then
                  # The bot app has no "Workflows" permission, so it cannot push .github/workflows changes.
                  if err=$(git push -q origin "refs/heads/$b:refs/heads/$b" 2>&1); then pushed=true
                  else push_err="push of \`$b\` was rejected: $(printf '%s' "$err" | grep -m1 -oE 'remote rejected.*|error: .*' | head -c 300)"; fi
                fi
              fi
            fi
            kept=""; [ $pushed = true ] && kept=" Progress so far is on \`$b\`; the next run continues it."
            [ -n "$push_err" ] && kept=" Progress not saved: $push_err"
            if [ "$LIMITED" = true ]; then say "paused at the Claude usage limit.$kept The scheduled run resumes this issue."; stop; fi
            if [ "$DEV" != success ] || [ "$OK" != true ] || [ $res = false ]; then
              gh issue edit "$N" --add-label agent:blocked >/dev/null; say "the develop run of #$N failed without a result (see the workflow run).$kept \`/agent retry\` resumes."; stop
            fi
            status=$(j status)
            case "$status" in
              needs_owner)
                q=$(python3 -c 'import json,os; print("\n".join("- "+q for q in json.load(open(os.environ["OUT"]+"/result.json"))["questions"]))')
                gh issue edit "$N" --add-label agent:needs-owner >/dev/null
                gh issue comment "$N" --body "@$OWNER the planner needs a decision before implementing:
          $q

          Answer with a comment that starts with \`/agent answer\`; the pipeline resumes by itself.
          <!-- agent-questions -->" >/dev/null
                stop ;;
              ready) ;;
              *) gh issue edit "$N" --add-label agent:blocked >/dev/null
                 say "blocked: $(j summary | head -c 1500)$kept  \`/agent retry\` resumes."; stop ;;
            esac
            if [ -n "$push_err" ]; then gh issue edit "$N" --add-label agent:blocked >/dev/null; say "$push_err Blocked."; stop; fi
            [ $pushed = true ] || { say "develop returned no commits; nothing to publish."; stop; }
            gh issue edit "$N" --remove-label agent:needs-owner >/dev/null 2>&1 || true
          else
            b=$PICKED
            git fetch -q origin "$b:refs/heads/$b"
            hw=$(bash scripts/agent/issue.sh marker "$N" plan | grep -oE 'agent-plan hw=(true|false)' | tail -n 1 | cut -d= -f2)
          fi
          sha=$(git rev-parse "refs/heads/$b")
          bash scripts/agent/diff-check.sh origin/main "$sha" | tee -a "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$b" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            kw=Closes; [ "$KIND" = uat ] && kw=Refs
            title=$(j pr_title 2>/dev/null); [ -n "$title" ] || title="agent: issue #$N"
            { echo "$kw #$N"; echo; echo "## Summary"; j summary; echo; echo "Plan: see the plan comment on #$N."; [ -n "$(j notes)" ] && { echo; echo "## Notes"; j notes; }
              echo; echo "Opened by the agent pipeline; gate, independent review and hardware test results follow as comments."; } > body.md
            url=$(gh pr create --draft --base main --head "$b" --title "$title" --body-file body.md)
            pr=${url##*/}
          elif [ "$STAGE" = develop ]; then
            gh pr comment "$pr" --body "Round $ROUND: new commits up to \`$sha\`.

          $(j summary)" >/dev/null
          fi
          appr=false
          gh pr view "$pr" --json comments --jq '.comments[] | select(.author.login == env.BOT_LOGIN) | .body' | grep -q "<!-- agent-diff-approval sha=$sha -->" && appr=true
          printf 'next=go\nsha=%s\nbranch=%s\npr=%s\nneeds_hwtest=%s\ndiff_approved=%s\n' "$sha" "$b" "$pr" "${hw:-true}" "$appr" >> "$GITHUB_OUTPUT"

  gate:
    needs: publish
    if: always() && needs.publish.outputs.next == 'go'
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}

  review:
    needs: [pick, publish]
    if: always() && needs.publish.outputs.next == 'go' && needs.pick.outputs.stage == 'develop' && needs.pick.outputs.kind == 'issue'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: agents
    permissions:
      contents: read
      issues: read
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g homey >/dev/null
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.pick.outputs.issue }}
        run: mkdir -p "$RUNNER_TEMP/ctx" && bash scripts/agent/issue.sh context "$N" "$RUNNER_TEMP/ctx/context.md"
      - id: c
        uses: ./.github/actions/claude
        env:
          VAR_ISSUE: ${{ needs.pick.outputs.issue }}
          VAR_ROUND: ${{ needs.pick.outputs.round }}
          VAR_BRANCH: ${{ needs.publish.outputs.branch }}
          VAR_SHA: ${{ needs.publish.outputs.sha }}
          VAR_CONTEXT: ${{ runner.temp }}/ctx/context.md
        with:
          prompt-file: .github/agent/review.md
          schema-file: .github/agent/review.schema.json
          model: sonnet
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: mkdir -p out && cp "${{ steps.c.outputs.result-file }}" out/review.json
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: out/
          retention-days: 3

  verdicts:
    # Decide (deterministically) whether the hardware test may run.
    needs: [pick, publish, gate, review]
    if: always() && needs.publish.outputs.next == 'go'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      review: ${{ steps.v.outputs.review }}
      hwtest: ${{ steps.v.outputs.hwtest }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.review.result == 'success'
        with:
          name: review
          path: ${{ runner.temp }}/out
        continue-on-error: true
      - id: v
        env:
          STAGE: ${{ needs.pick.outputs.stage }}
          KIND: ${{ needs.pick.outputs.kind }}
          GATE: ${{ needs.gate.outputs.green }}
          PROTECTED: ${{ needs.publish.outputs.protected }}
          APPROVED: ${{ needs.publish.outputs.diff_approved }}
          DOCS_ONLY: ${{ needs.publish.outputs.docs_only }}
          HW: ${{ needs.publish.outputs.needs_hwtest }}
          F: ${{ runner.temp }}/out/review.json
        run: |
          review=missing
          if [ "$STAGE" = verify ]; then review=approve
          elif [ "$KIND" = uat ]; then [ "$DOCS_ONLY" = true ] && review=approve || review=changes_requested
          elif [ -s "$F" ]; then
            review=$(python3 -c 'import json,os; r=json.load(open(os.environ["F"])); print("approve" if r.get("verdict")=="approve" and not r.get("blockers") and not r.get("majors") else "changes_requested")')
          fi
          hw=skip
          if [ "$GATE" = true ] && [ "$review" = approve ] && [ "$HW" = true ]; then
            if [ "$PROTECTED" = true ] && [ "$APPROVED" != true ]; then hw=needs-owner; else hw=run; fi
          fi
          printf 'review=%s\nhwtest=%s\n' "$review" "$hw" | tee -a "$GITHUB_OUTPUT"

  hwtest:
    needs: [pick, publish, verdicts]
    if: always() && needs.verdicts.outputs.hwtest == 'run'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    environment: hardware
    env:
      # Dev runs: over the LAN with the owner's API key (scripts/homey-dev-run.mjs, no Athom cloud); if that is not
      # available, via the cloud authenticated with HOMEY_PAT (no OAuth login). Both from the runner's key file.
      HOMEY_RUN_MODE: auto
      # Athom personal access token (environment secret): the Homey CLI's cloud paths use it instead of the OAuth login.
      HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
    permissions:
      contents: read # the pairing comment uses the bot token
    concurrency:
      group: hardware
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.rc.outputs.ready }}
      paired: ${{ steps.pair.outcome }}
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - name: Prepare the hardware runner
        # First step on purpose: mask the bench's user, home, host and runner name in every later log line (public
        # repository), and use the native git binary when the runner itself runs translated.
        run: |
          for v in "$(id -un)" "$HOME" "$(hostname -s)" "$(hostname)" "$RUNNER_NAME" "$(dirname "$RUNNER_WORKSPACE")"; do
            [ "${#v}" -ge 3 ] && echo "::add-mask::$v"
          done
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null)" = 1 ]; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec arch -arm64 /usr/bin/git "$@"\n' > "$RUNNER_TEMP/bin/git"
            chmod +x "$RUNNER_TEMP/bin/git"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - id: rc
        uses: ./.github/actions/runner-check
        with:
          require: tools,bluetooth,ble,camera,homey-api,homey-run,lock
          fail: "false"
      - name: Build and start the dev run
        if: steps.rc.outputs.ready == 'true'
        run: |
          # Quiet on purpose: CLI and app output name the Homey and the devices; the tester reads it on the Mac.
          if ! { npm ci && npm run build; } >/dev/null 2>&1; then echo "build failed"; exit 1; fi
          bash scripts/hw-snap.sh baseline >/dev/null 2>&1 || true
          scripts/homey-run.sh start 300 >/dev/null 2>&1 || { echo "dev run did not start"; exit 1; }
          scripts/homey-run.sh wait 'Running .com\.habbo656' 240 >/dev/null 2>&1 || { echo "app did not reach Running"; exit 1; }
          echo "dev run started"
      # The pairing request is a bot comment, so it needs the bot token; it is revoked right after the wait, before
      # the tester (a model with Bash on this Mac) starts.
      - id: bot
        if: steps.rc.outputs.ready == 'true'
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          skip-revoke: "true"
      - name: TimeBox paired and available
        id: pair
        if: steps.rc.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          N: ${{ needs.pick.outputs.issue }}
        run: bash scripts/agent/await-device.sh "$N" 30
      - name: Revoke the bot token
        if: always() && steps.bot.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api -X DELETE installation/token >/dev/null && echo "bot token revoked"
      - name: Trusted context
        if: steps.pair.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ needs.pick.outputs.issue }}
        run: mkdir -p "$RUNNER_TEMP/ctx" && bash scripts/agent/issue.sh context "$N" "$RUNNER_TEMP/ctx/context.md"
      - id: c
        if: steps.pair.outcome == 'success'
        uses: ./.github/actions/claude
        env:
          VAR_ISSUE: ${{ needs.pick.outputs.issue }}
          VAR_VERSION: ${{ needs.pick.outputs.version }}
          VAR_BRANCH: ${{ needs.publish.outputs.branch }}
          VAR_SHA: ${{ needs.publish.outputs.sha }}
          VAR_CONTEXT: ${{ runner.temp }}/ctx/context.md
        with:
          prompt-file: .github/agent/hwtest.md
          schema-file: .github/agent/hwtest.schema.json
          model: sonnet
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Stop the dev run
        if: always() && steps.rc.outputs.ready == 'true'
        env:
          KIND: ${{ needs.pick.outputs.kind }}
        run: |
          scripts/homey-run.sh stop >/dev/null 2>&1 || true
          # Before an owner UAT no dev build may stay installed (docs/uat/README.md).
          [ "$KIND" != uat ] || scripts/homey-run.sh stop --uninstall >/dev/null 2>&1 || true
          echo "dev run stopped"
      - if: always()
        run: |
          mkdir -p out
          f="${{ steps.c.outputs.result-file }}"; [ -n "$f" ] && [ -s "$f" ] && cp "$f" out/hwtest.json || echo '{}' > out/hwtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwtest
          path: out/
          retention-days: 3

  finish:
    needs: [pick, publish, gate, review, verdicts, hwtest]
    if: always() && needs.publish.outputs.next == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read # writes use the bot token
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/a
        continue-on-error: true
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          N: ${{ needs.pick.outputs.issue }}
          KIND: ${{ needs.pick.outputs.kind }}
          ROUND: ${{ needs.pick.outputs.round }}
          SHA: ${{ needs.publish.outputs.sha }}
          PR: ${{ needs.publish.outputs.pr }}
          GATE: ${{ needs.gate.outputs.green }}
          REVIEW: ${{ needs.verdicts.outputs.review }}
          HWPLAN: ${{ needs.verdicts.outputs.hwtest }}
          HWJOB: ${{ needs.hwtest.result }}
          HWREADY: ${{ needs.hwtest.outputs.ready }}
          PAIRED: ${{ needs.hwtest.outputs.paired }}
          A: ${{ runner.temp }}/a
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          say() { bash scripts/agent/issue.sh say "$N" "$1"; }
          jf() { python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get(sys.argv[2], ""))' "$1" "$2" 2>/dev/null; }
          problems=""
          # 1. Gate
          [ "$GATE" = true ] || problems="$problems
          - **Gate** red on \`$SHA\` ([run]($RUN_URL))."
          # 2. Review
          if [ -s "$A/review/review.json" ]; then
            gh pr comment "$PR" --body "## Independent review (round $ROUND): $(jf "$A/review/review.json" verdict)

          $(jf "$A/review/review.json" findings)
          <!-- agent-review sha=$SHA verdict=$REVIEW -->" >/dev/null
          fi
          [ "$REVIEW" = approve ] || problems="$problems
          - **Review**: $REVIEW (findings on PR #$PR)."
          # 3. Protected paths
          if [ "$HWPLAN" = needs-owner ]; then
            gh pr edit "$PR" --add-label owner:review >/dev/null 2>&1 || true
            say "PR #$PR changes protected paths (workflows, agent settings, runner scripts or dependencies). Review the diff of \`$SHA\` and comment \`/agent approve-diff\` on the PR (or merge it yourself). Nothing runs on the hardware runner before that."
            exit 0
          fi
          # 4. Hardware test
          hw=""
          if [ "$HWPLAN" = run ]; then
            if [ "$HWREADY" != true ]; then
              gh issue edit "$N" --add-label agent:needs-owner >/dev/null
              say "the hardware runner is not ready, so the test of \`$SHA\` did not run ([run]($RUN_URL), step summary of the hwtest job). Fix it (e.g. plug in the webcam, start the runner) and comment \`/agent retry\`."
              exit 0
            fi
            if [ "$PAIRED" != success ]; then
              gh issue edit "$N" --add-label agent:needs-owner >/dev/null
              say "no TimeBox was paired within 30 min, so the hardware test did not run. Comment \`/agent retry\` when you are at the Homey app."
              exit 0
            fi
            hw=$(jf "$A/hwtest/hwtest.json" verdict); [ -n "$hw" ] || hw=blocked
            gh pr comment "$PR" --body "## Hardware test: $hw

          $(jf "$A/hwtest/hwtest.json" report)
          <!-- agent-hwtest sha=$SHA verdict=$hw -->" >/dev/null
            if [ "$hw" = blocked ]; then
              gh issue edit "$N" --add-label agent:needs-owner >/dev/null
              say "the hardware test of \`$SHA\` is blocked (report on PR #$PR). Fix the bench and comment \`/agent retry\`."
              exit 0
            fi
            [ "$hw" = pass ] || problems="$problems
          - **Hardware test**: $hw (report on PR #$PR)."
            if [ "$KIND" = uat ] && [ "$hw" != pass ] && [ "$GATE" = true ] && [ "$REVIEW" = approve ]; then
              # The UAT doc is fine; the build failed its [auto] cases: merge the doc, file a uat-finding bug, fix it first.
              gh pr ready "$PR" >/dev/null 2>&1 || true
              gh pr merge "$PR" --squash --delete-branch
              ms=$(gh issue view "$N" --json milestone --jq '.milestone.title // empty')
              url=$(gh issue create --title "UAT pre-check failed on $SHA" --label type:bug --label uat-finding ${ms:+--milestone "$ms"} \
                --body "Found by the pipeline's hardware pre-check of the [auto] UAT cases (#$N, PR #$PR).

          $(jf "$A/hwtest/hwtest.json" report)")
              bash scripts/agent/issue.sh approve "${url##*/}" "$BOT" >/dev/null
              gh issue comment "$N" --body "Pre-check of the [auto] cases failed; fixing ${url##*/} first, then a new round.
          <!-- agent-uat-rejected round=$ROUND -->" >/dev/null
              gh workflow run agent-pipeline.yml -f from="$N"
              exit 0
            fi
          fi
          # 5. Merge or next round
          if [ -z "$problems" ]; then
            gh pr ready "$PR" >/dev/null 2>&1 || true
            gh pr merge "$PR" --squash --delete-branch
            gh issue edit "$N" --remove-label status:in-progress >/dev/null 2>&1 || true
            if [ "$KIND" = uat ]; then
              gh issue comment "$N" --body-file <(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("uat_checklist",""))' "$A/develop/result.json" 2>/dev/null; echo; echo "@$OWNER the UAT build is \`main\` after PR #$PR; the [auto] cases passed on the hardware. Please test and reply with a comment that starts with \`ACCEPTED\` or \`REJECTED UAT-n, …\` plus what you saw."; echo "<!-- agent-uat-ready -->") >/dev/null
            else
              gh workflow run agent-pipeline.yml -f from="$N"
            fi
            exit 0
          fi
          gh issue comment "$N" --body "## Findings, round $ROUND (\`$SHA\`)
          $problems
          <!-- agent-findings round=$ROUND sha=$SHA -->" >/dev/null
          if [ "$ROUND" -lt 3 ]; then
            gh workflow run agent-pipeline.yml -f issue="$N" -f round=$((ROUND + 1))
          else
            gh issue edit "$N" --add-label agent:blocked >/dev/null
            say "#$N is still red after 3 rounds (the last one with an Opus developer). Options: \`/agent retry\` (3 more rounds), \`/agent answer <instructions>\`, or close the issue."
          fi
